[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peakweights"
version = "0.1.0"
description = "One-pass, data-free discovery of critical LLM parameters"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Thiyagarajan Maruthavanan", email = "thiyagarajan@kalmantic.com"},
    {name = "Vamshi Ambati", email = "vamshi.ambati@gmail.com"}
]
keywords = [
    "llm",
    "quantization",
    "deep-learning",
    "transformers",
    "model-compression",
    "critical-weights",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5.0"]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
]
all = [
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
]

[project.scripts]
peakweights = "peakweights:main"

[project.urls]
Homepage = "https://github.com/Kalmantic/peakweights"
Documentation = "https://github.com/Kalmantic/peakweights#readme"
Repository = "https://github.com/Kalmantic/peakweights"
Issues = "https://github.com/Kalmantic/peakweights/issues"

[tool.setuptools]
py-modules = ["peakweights"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py38"
